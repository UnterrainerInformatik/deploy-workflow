name: Deployment 🚀

on:
  workflow_call:
    inputs:
      major_version:
        required: true
        type: string
      minor_version:
        required: true
        type: string
      build_version:
        required: true
        type: string
      # deprecated, ignored: WireGuard is used whenever WG_CONFIG is passed
      ovpn_enabled:
        required: false
        type: boolean
        default: false
      wg_enabled:
        required: false
        type: boolean
        default: false
    secrets:
      DEPLOY_SSH_PRIVATE_KEY:
        required: true
      DEPLOY_SSH_USER:
        required: true
      DEPLOY_SERVER:
        required: true
      DEPLOY_SSH_PORT:
        required: true
      DEPLOY_DIR:
        required: true
      DATA_DIR:
        required: true
      DOCKER_HUB_USER:
        required: true
      DOCKER_IMAGE_NAME:
        required: true
      # deprecated, ignored: OpenVPN is no longer supported
      VPN_OVPN_FILE:
        required: false
      VPN_USERNAME:
        required: false
      VPN_PASSWORD:
        required: false
      WG_CONFIG:
        required: false

jobs:
  deploy:
    name: Deployment 🚀
    runs-on: [self-hosted, Linux, X64]
    env:
      WG_CONFIG: ${{ secrets.WG_CONFIG }}

    steps:
      - name: Init Runner ⚙️
        uses: UnterrainerInformatik/init-runner-action@master

      - name: Install WireGuard 🛜
        if: ${{ env.WG_CONFIG != '' }}
        run: |
          command -v wg-quick >/dev/null || (sudo apt update && sudo apt install -y wireguard-tools)

      - name: Connect to WireGuard 🔓
        if: ${{ env.WG_CONFIG != '' }}
        run: |
          # self-hosted runner: tear down leftovers from a previous (aborted) run
          sudo wg-quick down wg-deploy 2>/dev/null || true
          # drop DNS lines (would need resolvconf and would hijack the runner's DNS)
          printf '%s\n' "$WG_CONFIG" | grep -viE '^\s*DNS\s*=' | sudo install -m 600 /dev/stdin /etc/wireguard/wg-deploy.conf
          sudo wg-quick up wg-deploy
          sudo wg show wg-deploy

      - name: Installing SSH key 🔑
        uses: UnterrainerInformatik/setup-ssh-action@master
        with:
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Create deploy directory 🚧
        uses: UnterrainerInformatik/ssh-mkdir-action@master
        with:
          dir: ${{ secrets.DEPLOY_DIR }}
          user: ${{ secrets.DEPLOY_SSH_USER }}
          host: ${{ secrets.DEPLOY_SERVER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}

      - name: Create data directory 🚧
        uses: UnterrainerInformatik/ssh-mkdir-action@master
        with:
          dir: ${{ secrets.DATA_DIR }}
          user: ${{ secrets.DEPLOY_SSH_USER }}
          host: ${{ secrets.DEPLOY_SERVER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}

      - name: Touch version.js file
        run: touch ./deploy/version.js

      - name: Touch .env file
        run: touch ./deploy/.env

      - name: Fill .env file
        run: |
          echo VERSION=${{ inputs.major_version }}.${{ inputs.minor_version }}.${{ inputs.build_version }} >> ./deploy/.env
          echo MAJOR_VERSION=${{ inputs.major_version }} >> ./deploy/.env
          echo MINOR_VERSION=${{ inputs.minor_version }} >> ./deploy/.env
          echo BUILD_VERSION=${{ inputs.build_version }} >> ./deploy/.env
          echo DOCKER_HUB_USER=${{ secrets.DOCKER_HUB_USER }} >> ./deploy/.env
          echo DOCKER_IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME }} >> ./deploy/.env

      - name: Deploy using SSH 🚛
        uses: UnterrainerInformatik/ssh-deploy-action@master
        with:
          source: ./deploy/
          target: ${{ secrets.DEPLOY_DIR }}
          chmod-mask: 777
          chmod-selector: ./deploy/*.sh
          user: ${{ secrets.DEPLOY_SSH_USER }}
          host: ${{ secrets.DEPLOY_SERVER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}

      - name: Run using SSH 🏃
        uses: UnterrainerInformatik/ssh-run-action@master
        with:
          dir: ${{ secrets.DEPLOY_DIR }}
          file: up.sh
          user: ${{ secrets.DEPLOY_SSH_USER }}
          host: ${{ secrets.DEPLOY_SERVER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}

      - name: Disconnect WireGuard 🔒
        if: ${{ always() && env.WG_CONFIG != '' }}
        run: |
          sudo wg-quick down wg-deploy || true
          sudo rm -f /etc/wireguard/wg-deploy.conf
